name: Windows desktop release

on:
  push:
    tags: ['v*']
  pull_request:
    paths: ['desktop/**', 'web/**', 'sounds/**', '.github/workflows/windows-release.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content desktop/package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match desktop/package.json version' }
      - run: npm --prefix web ci
      - run: npm --prefix desktop ci
      - run: npm --prefix web test
      - run: npm --prefix desktop test
      - name: Build offline Windows installers
        run: npm --prefix desktop run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Test packaged app
        run: npm --prefix desktop run smoke
      - name: Test the downloadable portable ZIP
        shell: pwsh
        run: |
          $zip = Get-ChildItem desktop/release/*-Portable.zip | Select-Object -First 1
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath desktop/release/portable-check
          node desktop/run-smoke.cjs "desktop/release/portable-check/MemeAim 3D.exe"
      - name: Compute download checksums
        shell: pwsh
        run: |
          Get-ChildItem desktop/release/* -File | Where-Object { $_.Extension -in '.exe','.zip' } | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content desktop/release/SHA256SUMS.txt -Encoding utf8
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            desktop/release/*.exe
            desktop/release/*.zip
            desktop/release/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-x64
          path: release
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/*.exe release/*.zip release/SHA256SUMS.txt --verify-tag --title "MemeAim 3D $RELEASE_TAG" --notes-file desktop/RELEASE_NOTES.md
